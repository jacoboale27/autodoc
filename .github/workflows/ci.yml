name: AutoDoc CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

env:
  FLUTTER_VERSION: '3.41.6'
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────
  # PR Check: analyze + test
  # ─────────────────────────────────────────
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run flutter analyze
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov bc

      - name: Check test coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep -m1 -E '^\s*lines' | awk '{print $2}' | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            echo "❌ No se pudo leer la cobertura desde lcov --summary"
            exit 1
          fi
          echo "Coverage: $COVERAGE%"
          # Medido el 2026-07-31 con `flutter test --coverage` sobre esta rama:
          # 1213 de 13988 líneas cubiertas = 8.7%. MIN se fija en 8 (redondeado
          # hacia abajo desde el número medido) para que la puerta sea real hoy
          # y suba a medida que se añadan tests en tareas posteriores.
          MIN=8
          if (( $(echo "$COVERAGE < $MIN" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% está por debajo del mínimo $MIN%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% pasa el umbral"

  # ─────────────────────────────────────────
  # PR Check: Firestore & Storage rules tests
  # ─────────────────────────────────────────
  rules_tests:
    name: Firestore & Storage Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Enable webframeworks experiment
        # Historico: cuando el target "landing" usaba "source": "landing-web"
        # (hosting consciente de frameworks), `firebase emulators:exec` intentaba
        # detectar frameworks web aunque este job solo necesita firestore y
        # storage, y sin el experimento fallaba con "Cannot emulate a web
        # framework because the experiment webframeworks is not enabled".
        #
        # Desde 332a384 el target sirve "public": "landing-web/out" (export
        # estatico), asi que esto probablemente ya sobra. Se deja porque es
        # inocuo y barato, y quitarlo solo se puede validar ejecutando el job.
        run: firebase experiments:enable webframeworks

      - name: Install rules test dependencies
        working-directory: test_rules
        run: npm ci

      - name: Run rules tests against the emulator
        working-directory: test_rules
        run: npm test

  # ─────────────────────────────────────────
  # PR Check: Flutter Web build smoke test
  # ─────────────────────────────────────────
  build_web_smoke:
    name: Flutter Web Build (Smoke)
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Limpiar artefactos previos
        # Salvaguarda barata, no el arreglo de un fallo vivo: aqui build/ ya
        # llega vacio porque cada job corre en un runner nuevo (actions/checkout
        # clona el repo desde cero) y el cache:true de subosito/flutter-action
        # cachea el SDK de Flutter, no el build/ del proyecto. El bundle
        # incompleto que motivo este paso (assets/ vacio, sin manifest.json,
        # sin favicon, con part.js de builds viejos mezclados) se reprodujo
        # compilando en local sobre un build/ sucio, no en este pipeline.
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Inject web runtime config
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          if [ -z "${{ secrets.FIREBASE_WEB_API_KEY }}" ]; then
            echo "❌ Falta el secreto FIREBASE_WEB_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_APP_ID_WEB }}" ]; then
            echo "❌ Falta el secreto FIREBASE_APP_ID_WEB"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_MESSAGING_SENDER_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_PROJECT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]; then
            echo "❌ Falta el secreto FIREBASE_AUTH_DOMAIN"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ]; then
            echo "❌ Falta el secreto FIREBASE_STORAGE_BUCKET"
            exit 1
          fi
          sed -i \
            -e "s|\$FIREBASE_WEB_API_KEY|${{ secrets.FIREBASE_WEB_API_KEY }}|g" \
            -e "s|\$FIREBASE_APP_ID_WEB|${{ secrets.FIREBASE_APP_ID_WEB }}|g" \
            -e "s|\$FIREBASE_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" \
            -e "s|\$FIREBASE_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" \
            -e "s|\$FIREBASE_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" \
            -e "s|\$FIREBASE_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" \
            web/firebase-messaging-sw.js
          grep -q '\$FIREBASE' web/firebase-messaging-sw.js && { echo "❌ Quedan marcadores sin sustituir"; exit 1; } || true
          echo "✅ configuracion web inyectada"

      - name: Build Flutter Web (release)
        # RECAPTCHA_SITE_KEY es opcional: si el secreto aun no esta configurado en el
        # repo, App Check simplemente queda sin site key (tolerante a fallos por diseno
        # de la Tarea 14) y el build no se bloquea. Los demas --dart-define no llevan
        # guardia [ -z ] adicional aqui porque los criticos (FIREBASE_WEB_API_KEY,
        # FIREBASE_PROJECT_ID, etc.) ya se validan en el paso "Inject web runtime
        # config" de arriba; un valor vacio en el resto simplemente resulta en
        # AppSecrets.xxx == '' en tiempo de ejecucion (fail-empty, no fail-silent).
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=FLAVOR=dev \
            --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=VEHICLE_IMAGE_API_KEY=${{ secrets.VEHICLE_IMAGE_API_KEY }}

  # ─────────────────────────────────────────
  # Deploy to Staging (on merge to staging branch)
  # ─────────────────────────────────────────
  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [analyze_and_test, rules_tests, build_web_smoke]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Limpiar artefactos previos
        # Salvaguarda barata, no el arreglo de un fallo vivo: aqui build/ ya
        # llega vacio porque cada job corre en un runner nuevo (actions/checkout
        # clona el repo desde cero) y el cache:true de subosito/flutter-action
        # cachea el SDK de Flutter, no el build/ del proyecto. El bundle
        # incompleto que motivo este paso (assets/ vacio, sin manifest.json,
        # sin favicon, con part.js de builds viejos mezclados) se reprodujo
        # compilando en local sobre un build/ sucio, no en este pipeline.
        run: flutter clean

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Inject web runtime config
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          if [ -z "${{ secrets.FIREBASE_WEB_API_KEY }}" ]; then
            echo "❌ Falta el secreto FIREBASE_WEB_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_APP_ID_WEB }}" ]; then
            echo "❌ Falta el secreto FIREBASE_APP_ID_WEB"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_MESSAGING_SENDER_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_PROJECT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]; then
            echo "❌ Falta el secreto FIREBASE_AUTH_DOMAIN"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ]; then
            echo "❌ Falta el secreto FIREBASE_STORAGE_BUCKET"
            exit 1
          fi
          sed -i \
            -e "s|\$FIREBASE_WEB_API_KEY|${{ secrets.FIREBASE_WEB_API_KEY }}|g" \
            -e "s|\$FIREBASE_APP_ID_WEB|${{ secrets.FIREBASE_APP_ID_WEB }}|g" \
            -e "s|\$FIREBASE_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" \
            -e "s|\$FIREBASE_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" \
            -e "s|\$FIREBASE_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" \
            -e "s|\$FIREBASE_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" \
            web/firebase-messaging-sw.js
          grep -q '\$FIREBASE' web/firebase-messaging-sw.js && { echo "❌ Quedan marcadores sin sustituir"; exit 1; } || true
          echo "✅ configuracion web inyectada"

      - name: Build Flutter Web for staging
        # RECAPTCHA_SITE_KEY es opcional: si el secreto aun no esta configurado en el
        # repo, App Check simplemente queda sin site key (tolerante a fallos por diseno
        # de la Tarea 14) y el build no se bloquea. Los demas --dart-define no llevan
        # guardia [ -z ] adicional aqui porque los criticos (FIREBASE_WEB_API_KEY,
        # FIREBASE_PROJECT_ID, etc.) ya se validan en el paso "Inject web runtime
        # config" de arriba; un valor vacio en el resto simplemente resulta en
        # AppSecrets.xxx == '' en tiempo de ejecucion (fail-empty, no fail-silent).
        # Este job usa "environment: staging" (ver la declaracion del job arriba),
        # por lo que estos secretos
        # deben configurarse como secretos de Environment "staging", no de repositorio.
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=FLAVOR=staging \
            --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=VEHICLE_IMAGE_API_KEY=${{ secrets.VEHICLE_IMAGE_API_KEY }}

      - name: Install Cloud Functions dependencies
        # Mismo motivo que en deploy_production: sin functions/node_modules el CLI
        # no puede cargar functions/index.js para descubrir los exports y aborta.
        working-directory: functions
        run: |
          npm ci
          node -e "require.resolve('firebase-functions')" || {
            echo "❌ firebase-functions no quedo instalado en functions/node_modules"
            exit 1
          }

      - name: Deploy Cloud Functions to Staging
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore Rules & Indexes to Staging
        # Las reglas se validan aqui, en un entorno real, antes de llegar a
        # produccion. Hasta la Tarea 16 solo se desplegaban directamente en prod.
        run: firebase deploy --only firestore --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Storage Rules to Staging
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Flutter Web to Firebase Hosting (Staging)
        # Solo el target "app". firebase.json declara dos targets de hosting
        # ("app" y "landing") pero .firebaserc unicamente mapea "landing" para
        # autodoc-6ef5a, asi que un "--only hosting" a secas contra staging
        # aborta con "Hosting target landing not configured for
        # autodoc-staging" y se lleva por delante tambien el deploy de "app".
        # Staging no tiene sitio de landing propio; cuando lo tenga, basta con
        # anadir el target a .firebaserc y volver a "--only hosting".
        run: firebase deploy --only hosting:app --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ─────────────────────────────────────────
  # Deploy to Production (on merge to main, manual trigger)
  # ─────────────────────────────────────────
  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [analyze_and_test, rules_tests, build_web_smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # GITHUB_TOKEN es de solo lectura por defecto en repos creados/configurados
    # despues de 2023. "Create version tag" necesita escribir el tag al remoto.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Limpiar artefactos previos
        # Salvaguarda barata, no el arreglo de un fallo vivo: aqui build/ ya
        # llega vacio porque cada job corre en un runner nuevo (actions/checkout
        # clona el repo desde cero) y el cache:true de subosito/flutter-action
        # cachea el SDK de Flutter, no el build/ del proyecto. El bundle
        # incompleto que motivo este paso (assets/ vacio, sin manifest.json,
        # sin favicon, con part.js de builds viejos mezclados) se reprodujo
        # compilando en local sobre un build/ sucio, no en este pipeline.
        run: flutter clean

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Inject web runtime config
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          if [ -z "${{ secrets.FIREBASE_WEB_API_KEY }}" ]; then
            echo "❌ Falta el secreto FIREBASE_WEB_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_APP_ID_WEB }}" ]; then
            echo "❌ Falta el secreto FIREBASE_APP_ID_WEB"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_MESSAGING_SENDER_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_PROJECT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]; then
            echo "❌ Falta el secreto FIREBASE_AUTH_DOMAIN"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ]; then
            echo "❌ Falta el secreto FIREBASE_STORAGE_BUCKET"
            exit 1
          fi
          sed -i \
            -e "s|\$FIREBASE_WEB_API_KEY|${{ secrets.FIREBASE_WEB_API_KEY }}|g" \
            -e "s|\$FIREBASE_APP_ID_WEB|${{ secrets.FIREBASE_APP_ID_WEB }}|g" \
            -e "s|\$FIREBASE_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" \
            -e "s|\$FIREBASE_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" \
            -e "s|\$FIREBASE_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" \
            -e "s|\$FIREBASE_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" \
            web/firebase-messaging-sw.js
          grep -q '\$FIREBASE' web/firebase-messaging-sw.js && { echo "❌ Quedan marcadores sin sustituir"; exit 1; } || true
          echo "✅ configuracion web inyectada"

      - name: Build Flutter Web for production
        # RECAPTCHA_SITE_KEY es opcional: si el secreto aun no esta configurado en el
        # repo, App Check simplemente queda sin site key (tolerante a fallos por diseno
        # de la Tarea 14) y el build no se bloquea. Los demas --dart-define no llevan
        # guardia [ -z ] adicional aqui porque los criticos (FIREBASE_WEB_API_KEY,
        # FIREBASE_PROJECT_ID, etc.) ya se validan en el paso "Inject web runtime
        # config" de arriba; un valor vacio en el resto simplemente resulta en
        # AppSecrets.xxx == '' en tiempo de ejecucion (fail-empty, no fail-silent).
        # Este job usa "environment: production" (ver la declaracion del job arriba),
        # por lo que estos secretos
        # deben configurarse como secretos de Environment "production", no de repositorio.
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=FLAVOR=prod \
            --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=VEHICLE_IMAGE_API_KEY=${{ secrets.VEHICLE_IMAGE_API_KEY }}

      - name: Deploy Firestore Rules & Indexes to Production
        run: firebase deploy --only firestore --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Storage Rules to Production
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install Cloud Functions dependencies
        # `firebase deploy --only functions` carga functions/index.js EN EL RUNNER
        # para descubrir que exports hay que desplegar. functions/node_modules esta
        # en .gitignore (linea 69), asi que en una VM limpia el
        # require('firebase-functions') de index.js:1 falla y el CLI aborta con un
        # inutil "An unexpected error has occurred." (exit 2), precedido solo de un
        # warning. firebase-tools NO instala dependencias por ti en local: solo las
        # instala Cloud Build, del lado del servidor, y para eso el descubrimiento
        # tiene que haber funcionado antes.
        working-directory: functions
        run: |
          npm ci
          node -e "require.resolve('firebase-functions')" || {
            echo "❌ firebase-functions no quedo instalado en functions/node_modules"
            exit 1
          }

      - name: Deploy Cloud Functions to Production
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Build landing-web static export
        # El target "landing" de firebase.json sirve "public": "landing-web/out",
        # un export estatico ya construido (desde 332a384 dejo de usar hosting
        # consciente de frameworks, que era lo que justificaba el antiguo
        # "firebase experiments:enable webframeworks" de este job).
        #
        # "landing-web/out/" esta en .gitignore, asi que en una VM limpia NO
        # existe: sin este "pnpm build" el deploy publicaba un directorio vacio
        # y la landing se quedaba servida desde lo ultimo que alguien hubiera
        # subido a mano. Instalar dependencias sin construir, que es lo que
        # hacia este paso antes, no producia ningun "out".
        run: |
          npm install -g pnpm
          cd landing-web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify landing-web export exists
        # Un "out" vacio o ausente aqui significa publicar una landing en blanco.
        # Mejor romper el pipeline que desplegar la nada.
        run: test -s landing-web/out/es.html

      - name: Deploy Flutter Web to Firebase Hosting (Production)
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Post-deploy smoke test
        run: |
          # URL derivada del mismo secreto que usan los pasos de deploy de arriba
          # (proyecto Firebase Hosting objetivo), en vez de un dominio hardcodeado.
          URL="https://${{ secrets.FIREBASE_PROJECT_PROD }}.web.app"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$CODE" != "200" ]; then echo "❌ Hosting responde $CODE"; exit 1; fi
          if ! curl -s "$URL" | grep -q 'flutter_bootstrap.js'; then
            echo "❌ index.html no referencia flutter_bootstrap.js"; exit 1
          fi
          ASSET_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/main.dart.js")
          if [ "$ASSET_CODE" != "200" ]; then
            echo "❌ main.dart.js responde $ASSET_CODE (esperado 200); Firebase Hosting puede estar sirviendo el fallback de index.html en vez del asset real"
            exit 1
          fi
          CC=$(curl -s -I "$URL/main.dart.js" | grep -i '^cache-control' || true)
          echo "Cache-Control de main.dart.js: $CC"
          if [ -z "$CC" ]; then
            echo "❌ main.dart.js respondio 200 pero sin cabecera Cache-Control; no se puede verificar la ausencia de 'immutable'"
            exit 1
          fi
          if echo "$CC" | grep -qi 'immutable'; then
            echo "❌ main.dart.js sigue marcado como immutable"; exit 1
          fi
          echo "✅ Smoke test correcto"

      - name: Create version tag
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          if git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null 2>&1; then
            echo "ℹ️ El tag v$VERSION ya existe en el remoto; no se crea de nuevo (idempotente)"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

  # ─────────────────────────────────────────
  # Build APK firmado + publicar GitHub Release (solo main)
  # ─────────────────────────────────────────
  release_apk:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    # Va DESPUES del deploy, no en paralelo: asi el tag vSemVer ya existe cuando
    # se crea la release, y un fallo firmando el APK nunca puede tumbar el
    # despliegue de produccion, que es lo critico.
    needs: deploy_production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: write
    steps:
      # Firmar el APK necesita una keystore propia. Mientras no exista, este job
      # se SALTA en vez de fallar: un job rojo permanente ensena a ignorar el
      # rojo, y el resto del pipeline (incluido el deploy a produccion, que ya
      # ha terminado a estas alturas) esta perfectamente sano sin el APK.
      - name: Check signing configuration
        id: firma
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]              && [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK no publicado: faltan los secretos de firma."
            echo "ℹ️ Sin ANDROID_KEYSTORE_BASE64 / GOOGLE_SERVICES_JSON_BASE64."
            echo "   Este job queda en verde a proposito; ver docs/RELEASE_APK.md."
          fi

      - name: Checkout code
        if: steps.firma.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Java
        if: steps.firma.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        if: steps.firma.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        if: steps.firma.outputs.ready == 'true'
        run: flutter pub get

      - name: Restore release keystore
        if: steps.firma.outputs.ready == 'true'
        # Sin keystore propia, Gradle cae a la clave de debug que el runner genera
        # al vuelo: SHA-1 distinto en cada ejecucion, ninguno registrado en
        # Firebase, y Google Sign-In muere con ApiException 10 en el dispositivo.
        # Un APK asi parece correcto hasta que alguien intenta iniciar sesion, de
        # modo que aqui se falla en voz alta en vez de publicar esa trampa.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID || secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          faltan=""
          [ -z "$KEYSTORE_B64" ]  && faltan="$faltan ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && faltan="$faltan ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ]  && faltan="$faltan ANDROID_KEY_PASSWORD"
          [ -z "$KEY_ALIAS" ]     && faltan="$faltan ANDROID_KEY_ALIAS"
          if [ -n "$faltan" ]; then
            echo "❌ Faltan secretos para firmar el APK:$faltan"
            echo "   Genera la keystore y registra su SHA-1 en Firebase Console"
            echo "   (Project settings › Android app › Add fingerprint) antes de"
            echo "   configurarlos. Ver docs/RELEASE_APK.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/autodoc-release.jks
          cat > android/key.properties <<EOF
          storeFile=autodoc-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          if [ -z "$MAPS_KEY" ]; then
            echo "❌ Falta el secreto GOOGLE_MAPS_API_KEY (el manifest de Android lo necesita)"
            exit 1
          fi
          # El SHA-1 se calcula de la keystore que se acaba de restaurar en vez
          # de leerlo de otro secreto: asi la huella que la app anuncia en la
          # cabecera X-Android-Cert es siempre, por construccion, la del
          # certificado con el que este APK queda firmado. Un secreto aparte
          # podria quedar desfasado al rotar la keystore, y Google devolveria
          # 403 en las traducciones sin motivo aparente.
          CERT_SHA1=$(keytool -list -v \
            -keystore android/autodoc-release.jks \
            -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" \
            | grep -m1 'SHA1:' | awk '{print $2}' | tr -d ':')
          if [ ${#CERT_SHA1} -ne 40 ]; then
            echo "❌ No se pudo extraer el SHA-1 de la keystore (se obtuvo: '$CERT_SHA1')"
            exit 1
          fi
          echo "ANDROID_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
          echo "✅ keystore restaurada (SHA-1 $CERT_SHA1)"

      - name: Restore Firebase Android config
        if: steps.firma.outputs.ready == 'true'
        # android/app/google-services.json esta en .gitignore, asi que el runner
        # no lo tiene. El plugin com.google.gms.google-services lo exige y aborta
        # el build sin el. No es material secreto —va incrustado en cada APK que
        # se distribuye— pero se respeta la decision del repo de no versionarlo y
        # entra por secreto, igual que la keystore.
        env:
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_JSON_B64" ]; then
            echo "❌ Falta el secreto GOOGLE_SERVICES_JSON_BASE64"
            echo "   Generalo con: base64 -w0 android/app/google-services.json"
            exit 1
          fi
          echo "$GS_JSON_B64" | base64 -d > android/app/google-services.json
          # Sin cliente OAuth de Android (client_type 1) no hay huella SHA-1
          # registrada, y Google Sign-In muere con ApiException 10 en el telefono
          # aunque el APK se instale y arranque sin quejarse. Comprobarlo aqui
          # cuesta un segundo y evita publicar una release inservible.
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('android/app/google-services.json'))
          c = next((c for c in d['client']
                    if c['client_info']['android_client_info']['package_name']
                    == 'com.autodoc.app'), None)
          if c is None:
              sys.exit('ERROR: google-services.json no describe com.autodoc.app')
          if not any(o['client_type'] == 1 for o in c.get('oauth_client', [])):
              sys.exit('ERROR: com.autodoc.app no tiene huella SHA-1 registrada '
                       'en Firebase; Google Sign-In fallaria con ApiException 10')
          print('OK: google-services.json correcto y con huella SHA-1')
          EOF

      - name: Build release APK
        if: steps.firma.outputs.ready == 'true'
        # El APK usa GOOGLE_MAPS_API_KEY_ANDROID si existe, y si no cae a la key
        # compartida. Las de Firebase nacen sin restringir, pero en cuanto se
        # restrinjan —y hay que hacerlo: una key abierta dentro de un APK publico
        # es cuota de terceros a tu cuenta— la de Android va atada a package +
        # SHA-1 y la de web a referrer HTTP: la misma key no puede servir a las
        # dos plataformas.
        # GOOGLE_MAPS_API_KEY va como variable de entorno ademas de --dart-define:
        # el lado Dart lo lee por dart-define, pero el manifestPlaceholder de
        # AndroidManifest lo resuelve Gradle, que en CI no tiene .env que leer.
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID || secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "${{ secrets.FIREBASE_ANDROID_API_KEY }}" ] || [ -z "${{ secrets.FIREBASE_APP_ID_ANDROID }}" ]; then
            echo "❌ Faltan FIREBASE_ANDROID_API_KEY o FIREBASE_APP_ID_ANDROID."
            echo "   Sin ellos Firebase.initializeApp falla al arrancar la app."
            exit 1
          fi
          flutter build apk --release \
            --dart-define=FLAVOR=prod \
            --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --dart-define=FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY }} \
            --dart-define=FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID || secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=ANDROID_CERT_SHA1=${{ env.ANDROID_CERT_SHA1 }} \
            --dart-define=VEHICLE_IMAGE_API_KEY=${{ secrets.VEHICLE_IMAGE_API_KEY }}

      - name: Verify APK signature
        if: steps.firma.outputs.ready == 'true'
        # apksigner dice con que certificado quedo firmado de verdad. Si aqui
        # aparece "CN=Android Debug" es que key.properties no se aplico y el APK
        # no sirve para iniciar sesion, aunque se instale sin problemas.
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK" || { echo "❌ No se genero el APK"; exit 1; }
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "❌ apksigner no encontrado en $SDK"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi 'CN=Android Debug' /tmp/certs.txt; then
            echo "❌ El APK quedo firmado con la clave de DEBUG, no con la de release"
            exit 1
          fi
          echo "✅ APK firmado con la keystore de release ($(du -h "$APK" | cut -f1))"

      - name: Publish GitHub Release
        if: steps.firma.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          TAG="v$VERSION"
          # El '+' del build number es valido en un tag de git pero se interpreta
          # como espacio al descargar por URL, asi que el archivo lo evita.
          ASSET="autodoc-$(echo "$VERSION" | sed 's/+/-build/').apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$ASSET"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "ℹ️ La release $TAG ya existe; se reemplaza el APK adjunto"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "AutoDoc $VERSION" \
              --notes "APK de release firmado, construido automaticamente desde \`main\` (commit ${GITHUB_SHA:0:7}).

          Instalacion: descarga el APK y permite \"instalar apps de origenes desconocidos\" en el dispositivo."
          fi
          echo "✅ Release $TAG publicada con $ASSET"
