name: AutoDoc CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

env:
  FLUTTER_VERSION: '3.32.0'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────
  # PR Check: analyze + test
  # ─────────────────────────────────────────
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test --coverage

      - name: Check test coverage threshold (55%)
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 55" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below minimum 55%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% passes threshold"
        continue-on-error: true  # Don't block until coverage is built up

  # ─────────────────────────────────────────
  # PR Check: Flutter Web build smoke test
  # ─────────────────────────────────────────
  build_web_smoke:
    name: Flutter Web Build (Smoke)
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject Google Sign-In client ID into web/index.html
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          echo "✅ client ID inyectado"

      - name: Build Flutter Web (release)
        run: flutter build web --release --no-web-resources-cdn --dart-define=FLAVOR=dev

  # ─────────────────────────────────────────
  # Deploy to Staging (on merge to staging branch)
  # ─────────────────────────────────────────
  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [analyze_and_test, build_web_smoke]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Inject Google Sign-In client ID into web/index.html
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          echo "✅ client ID inyectado"

      - name: Build Flutter Web for staging
        run: flutter build web --release --no-web-resources-cdn --dart-define=FLAVOR=staging

      - name: Deploy Cloud Functions to Staging
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Flutter Web to Firebase Hosting (Staging)
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ─────────────────────────────────────────
  # Deploy to Production (on merge to main, manual trigger)
  # ─────────────────────────────────────────
  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [analyze_and_test, build_web_smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Inject Google Sign-In client ID into web/index.html
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          echo "✅ client ID inyectado"

      - name: Build Flutter Web for production
        run: flutter build web --release --no-web-resources-cdn --dart-define=FLAVOR=prod

      - name: Deploy Firestore Rules & Indexes to Production
        run: firebase deploy --only firestore --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Storage Rules to Production
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Cloud Functions to Production
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Flutter Web to Firebase Hosting (Production)
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Create GitHub Release tag
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "Version: $(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')"
