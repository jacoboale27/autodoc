name: AutoDoc CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

env:
  FLUTTER_VERSION: '3.32.0'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────
  # PR Check: analyze + test
  # ─────────────────────────────────────────
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run flutter analyze
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov bc

      - name: Check test coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep -m1 -E '^\s*lines' | awk '{print $2}' | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            echo "❌ No se pudo leer la cobertura desde lcov --summary"
            exit 1
          fi
          echo "Coverage: $COVERAGE%"
          # Medido el 2026-07-31 con `flutter test --coverage` sobre esta rama:
          # 1213 de 13988 líneas cubiertas = 8.7%. MIN se fija en 8 (redondeado
          # hacia abajo desde el número medido) para que la puerta sea real hoy
          # y suba a medida que se añadan tests en tareas posteriores.
          MIN=8
          if (( $(echo "$COVERAGE < $MIN" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% está por debajo del mínimo $MIN%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% pasa el umbral"

  # ─────────────────────────────────────────
  # PR Check: Firestore & Storage rules tests
  # ─────────────────────────────────────────
  rules_tests:
    name: Firestore & Storage Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules test dependencies
        working-directory: test_rules
        run: npm ci

      - name: Run rules tests against the emulator
        working-directory: test_rules
        run: npm test

  # ─────────────────────────────────────────
  # PR Check: Flutter Web build smoke test
  # ─────────────────────────────────────────
  build_web_smoke:
    name: Flutter Web Build (Smoke)
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject web runtime config
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          if [ -z "${{ secrets.FIREBASE_WEB_API_KEY }}" ]; then
            echo "❌ Falta el secreto FIREBASE_WEB_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_APP_ID_WEB }}" ]; then
            echo "❌ Falta el secreto FIREBASE_APP_ID_WEB"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_MESSAGING_SENDER_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_PROJECT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]; then
            echo "❌ Falta el secreto FIREBASE_AUTH_DOMAIN"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ]; then
            echo "❌ Falta el secreto FIREBASE_STORAGE_BUCKET"
            exit 1
          fi
          sed -i \
            -e "s|\$FIREBASE_WEB_API_KEY|${{ secrets.FIREBASE_WEB_API_KEY }}|g" \
            -e "s|\$FIREBASE_APP_ID_WEB|${{ secrets.FIREBASE_APP_ID_WEB }}|g" \
            -e "s|\$FIREBASE_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" \
            -e "s|\$FIREBASE_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" \
            -e "s|\$FIREBASE_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" \
            -e "s|\$FIREBASE_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" \
            web/firebase-messaging-sw.js
          grep -q '\$FIREBASE' web/firebase-messaging-sw.js && { echo "❌ Quedan marcadores sin sustituir"; exit 1; } || true
          echo "✅ configuracion web inyectada"

      - name: Build Flutter Web (release)
        # RECAPTCHA_SITE_KEY es opcional: si el secreto aun no esta configurado en el
        # repo, App Check simplemente queda sin site key (tolerante a fallos por diseno
        # de la Tarea 14) y el build no se bloquea. Los demas --dart-define no llevan
        # guardia [ -z ] adicional aqui porque los criticos (FIREBASE_WEB_API_KEY,
        # FIREBASE_PROJECT_ID, etc.) ya se validan en el paso "Inject web runtime
        # config" de arriba; un valor vacio en el resto simplemente resulta en
        # AppSecrets.xxx == '' en tiempo de ejecucion (fail-empty, no fail-silent).
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=FLAVOR=dev \
            --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=VEHICLE_IMAGE_API_KEY=${{ secrets.VEHICLE_IMAGE_API_KEY }} \
            --dart-define=GOOGLE_CUSTOM_SEARCH_API_KEY=${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }} \
            --dart-define=GOOGLE_CUSTOM_SEARCH_CX=${{ secrets.GOOGLE_CUSTOM_SEARCH_CX }}

  # ─────────────────────────────────────────
  # Deploy to Staging (on merge to staging branch)
  # ─────────────────────────────────────────
  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [analyze_and_test, rules_tests, build_web_smoke]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Inject web runtime config
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          if [ -z "${{ secrets.FIREBASE_WEB_API_KEY }}" ]; then
            echo "❌ Falta el secreto FIREBASE_WEB_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_APP_ID_WEB }}" ]; then
            echo "❌ Falta el secreto FIREBASE_APP_ID_WEB"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_MESSAGING_SENDER_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_PROJECT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]; then
            echo "❌ Falta el secreto FIREBASE_AUTH_DOMAIN"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ]; then
            echo "❌ Falta el secreto FIREBASE_STORAGE_BUCKET"
            exit 1
          fi
          sed -i \
            -e "s|\$FIREBASE_WEB_API_KEY|${{ secrets.FIREBASE_WEB_API_KEY }}|g" \
            -e "s|\$FIREBASE_APP_ID_WEB|${{ secrets.FIREBASE_APP_ID_WEB }}|g" \
            -e "s|\$FIREBASE_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" \
            -e "s|\$FIREBASE_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" \
            -e "s|\$FIREBASE_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" \
            -e "s|\$FIREBASE_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" \
            web/firebase-messaging-sw.js
          grep -q '\$FIREBASE' web/firebase-messaging-sw.js && { echo "❌ Quedan marcadores sin sustituir"; exit 1; } || true
          echo "✅ configuracion web inyectada"

      - name: Build Flutter Web for staging
        # RECAPTCHA_SITE_KEY es opcional: si el secreto aun no esta configurado en el
        # repo, App Check simplemente queda sin site key (tolerante a fallos por diseno
        # de la Tarea 14) y el build no se bloquea. Los demas --dart-define no llevan
        # guardia [ -z ] adicional aqui porque los criticos (FIREBASE_WEB_API_KEY,
        # FIREBASE_PROJECT_ID, etc.) ya se validan en el paso "Inject web runtime
        # config" de arriba; un valor vacio en el resto simplemente resulta en
        # AppSecrets.xxx == '' en tiempo de ejecucion (fail-empty, no fail-silent).
        # Este job usa "environment: staging" (ver la declaracion del job arriba),
        # por lo que estos secretos
        # deben configurarse como secretos de Environment "staging", no de repositorio.
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=FLAVOR=staging \
            --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=VEHICLE_IMAGE_API_KEY=${{ secrets.VEHICLE_IMAGE_API_KEY }} \
            --dart-define=GOOGLE_CUSTOM_SEARCH_API_KEY=${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }} \
            --dart-define=GOOGLE_CUSTOM_SEARCH_CX=${{ secrets.GOOGLE_CUSTOM_SEARCH_CX }}

      - name: Deploy Cloud Functions to Staging
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore Rules & Indexes to Staging
        # Las reglas se validan aqui, en un entorno real, antes de llegar a
        # produccion. Hasta la Tarea 16 solo se desplegaban directamente en prod.
        run: firebase deploy --only firestore --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Storage Rules to Staging
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Flutter Web to Firebase Hosting (Staging)
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ─────────────────────────────────────────
  # Deploy to Production (on merge to main, manual trigger)
  # ─────────────────────────────────────────
  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [analyze_and_test, rules_tests, build_web_smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # GITHUB_TOKEN es de solo lectura por defecto en repos creados/configurados
    # despues de 2023. "Create version tag" necesita escribir el tag al remoto.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Inject web runtime config
        run: |
          if [ -z "${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}" ]; then
            echo "❌ Falta el secreto GOOGLE_SIGNIN_CLIENT_ID_WEB"
            exit 1
          fi
          sed -i "s|\$GOOGLE_SIGNIN_CLIENT_ID_WEB|${{ secrets.GOOGLE_SIGNIN_CLIENT_ID_WEB }}|g" web/index.html
          grep -q '\$GOOGLE_SIGNIN_CLIENT_ID_WEB' web/index.html && { echo "❌ Quedo el marcador sin sustituir"; exit 1; } || true
          if [ -z "${{ secrets.FIREBASE_WEB_API_KEY }}" ]; then
            echo "❌ Falta el secreto FIREBASE_WEB_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_APP_ID_WEB }}" ]; then
            echo "❌ Falta el secreto FIREBASE_APP_ID_WEB"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_MESSAGING_SENDER_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ Falta el secreto FIREBASE_PROJECT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]; then
            echo "❌ Falta el secreto FIREBASE_AUTH_DOMAIN"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_STORAGE_BUCKET }}" ]; then
            echo "❌ Falta el secreto FIREBASE_STORAGE_BUCKET"
            exit 1
          fi
          sed -i \
            -e "s|\$FIREBASE_WEB_API_KEY|${{ secrets.FIREBASE_WEB_API_KEY }}|g" \
            -e "s|\$FIREBASE_APP_ID_WEB|${{ secrets.FIREBASE_APP_ID_WEB }}|g" \
            -e "s|\$FIREBASE_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" \
            -e "s|\$FIREBASE_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" \
            -e "s|\$FIREBASE_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" \
            -e "s|\$FIREBASE_STORAGE_BUCKET|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" \
            web/firebase-messaging-sw.js
          grep -q '\$FIREBASE' web/firebase-messaging-sw.js && { echo "❌ Quedan marcadores sin sustituir"; exit 1; } || true
          echo "✅ configuracion web inyectada"

      - name: Build Flutter Web for production
        # RECAPTCHA_SITE_KEY es opcional: si el secreto aun no esta configurado en el
        # repo, App Check simplemente queda sin site key (tolerante a fallos por diseno
        # de la Tarea 14) y el build no se bloquea. Los demas --dart-define no llevan
        # guardia [ -z ] adicional aqui porque los criticos (FIREBASE_WEB_API_KEY,
        # FIREBASE_PROJECT_ID, etc.) ya se validan en el paso "Inject web runtime
        # config" de arriba; un valor vacio en el resto simplemente resulta en
        # AppSecrets.xxx == '' en tiempo de ejecucion (fail-empty, no fail-silent).
        # Este job usa "environment: production" (ver la declaracion del job arriba),
        # por lo que estos secretos
        # deben configurarse como secretos de Environment "production", no de repositorio.
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=FLAVOR=prod \
            --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }} \
            --dart-define=FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=VEHICLE_IMAGE_API_KEY=${{ secrets.VEHICLE_IMAGE_API_KEY }} \
            --dart-define=GOOGLE_CUSTOM_SEARCH_API_KEY=${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }} \
            --dart-define=GOOGLE_CUSTOM_SEARCH_CX=${{ secrets.GOOGLE_CUSTOM_SEARCH_CX }}

      - name: Deploy Firestore Rules & Indexes to Production
        run: firebase deploy --only firestore --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Storage Rules to Production
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Cloud Functions to Production
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Flutter Web to Firebase Hosting (Production)
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_PROD }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Post-deploy smoke test
        run: |
          # URL derivada del mismo secreto que usan los pasos de deploy de arriba
          # (proyecto Firebase Hosting objetivo), en vez de un dominio hardcodeado.
          URL="https://${{ secrets.FIREBASE_PROJECT_PROD }}.web.app"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$CODE" != "200" ]; then echo "❌ Hosting responde $CODE"; exit 1; fi
          if ! curl -s "$URL" | grep -q 'flutter_bootstrap.js'; then
            echo "❌ index.html no referencia flutter_bootstrap.js"; exit 1
          fi
          ASSET_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/main.dart.js")
          if [ "$ASSET_CODE" != "200" ]; then
            echo "❌ main.dart.js responde $ASSET_CODE (esperado 200); Firebase Hosting puede estar sirviendo el fallback de index.html en vez del asset real"
            exit 1
          fi
          CC=$(curl -s -I "$URL/main.dart.js" | grep -i '^cache-control' || true)
          echo "Cache-Control de main.dart.js: $CC"
          if [ -z "$CC" ]; then
            echo "❌ main.dart.js respondio 200 pero sin cabecera Cache-Control; no se puede verificar la ausencia de 'immutable'"
            exit 1
          fi
          if echo "$CC" | grep -qi 'immutable'; then
            echo "❌ main.dart.js sigue marcado como immutable"; exit 1
          fi
          echo "✅ Smoke test correcto"

      - name: Create version tag
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          if git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null 2>&1; then
            echo "ℹ️ El tag v$VERSION ya existe en el remoto; no se crea de nuevo (idempotente)"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
