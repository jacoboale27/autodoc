<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AutoDoc - Gestión inteligente de mantenimiento vehicular.">
  <meta property="og:title" content="AutoDoc">
  <meta property="og:description" content="Tu garaje virtual y control de servicios.">
  <!--
    Client ID OAuth de tipo Web del proyecto (el mismo `client_type: 3` que ya
    viene commiteado en android/app/google-services.json). Va literal a
    proposito: de este archivo `flutter build web` solo sustituye la base href,
    asi que el placeholder que habia aqui antes llegaba tal cual al navegador.
    Un client ID de OAuth es un identificador publico —se envia en cada peticion
    de autorizacion—, no un secreto.

    Hoy el login web NO pasa por aqui: AuthService usa
    FirebaseAuth.signInWithPopup, que resuelve su cliente OAuth desde la consola
    de Firebase y nunca lee este meta. Se deja correcto para el unico consumidor
    real que queda (google_sign_in_web, que lo lee al inicializarse) y para si
    algun dia el flujo web se migra al paquete.
  -->
  <meta name="google-signin-client_id" content="702895874700-ffjqoc3c4a8uca611o7r86k06g91213d.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="autodoc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>autodoc</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
